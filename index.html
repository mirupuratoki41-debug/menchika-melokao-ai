<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メンズ地下アイドル メロ顔AI診断</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #121212; color: #ffffff; text-align: center; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    .card-container { display: flex; justify-content: space-around; margin-top: 20px; gap: 10px; }
    .idol-card { background: #1e1e1e; border-radius: 12px; padding: 10px; width: 45%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
    .idol-card:hover { border-color: #ff4081; }
    .idol-card img { width: 100%; border-radius: 8px; height: 200px; object-fit: cover; }
    .skip-btn { margin-top: 25px; padding: 12px 24px; background: #333; color: #ccc; border: 1px solid #555; border-radius: 20px; cursor: pointer; font-size: 14px; }
    .skip-btn:hover { background: #444; color: #fff; }
    .hidden { display: none; }
    .result-box { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-top: 20px; text-align: left; }
    .top9-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
    .top9-item { background: #2a2a2a; padding: 5px; border-radius: 8px; text-align: center; font-size: 12px; }
    .top9-item img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; }
    .badge { background: #ff4081; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>メン地下メロ顔AI診断</h1>

  <!-- 診断画面 -->
  <div id="quiz-section">
    <p id="progress">第 1 / 10 問：好みの顔を選んでね！</p>
    <div class="card-container" id="candidates-box">
      <!-- JSで候補カードを挿入 -->
    </div>
    <button class="skip-btn" onclick="skipQuestion()">好みのタイプがいない（スキップ）</button>
  </div>

  <!-- 結果画面 -->
  <div id="result-section" class="hidden">
    <h2>診断結果</h2>
    <div class="result-box">
      <h3 id="result-type" style="color: #ff4081;">---</h3>
      <p id="type-desc"></p>
      <h4>🔥 毒舌アドバイス</h4>
      <p id="toxic-advice" style="color: #ff80ab;"></p>
      
      <h4>📊 あなたの5軸スコア</h4>
      <ul id="radar-scores"></ul>

      <h4>💖 MY TOP 9</h4>
      <div class="top9-grid" id="top9-box"></div>
    </div>
  </div>
</div>

<script>
  // ※本番デプロイ時は Render 等のURL (例: https://xxx.onrender.com) に書き換えてください
  const BASE_URL = 'http://localhost:8000'; 
  
  let currentQuestion = 1;
  const totalQuestions = 10;
  let selectedIdolIds = [];

  // 初期読み込み
  window.onload = () => {
    loadNextCandidates();
  };

  // 次の候補2つを取得して表示
  async function loadNextCandidates() {
    try {
      const res = await fetch(`${BASE_URL}/api/next-candidates`);
      const data = await res.json();
      
      const box = document.getElementById('candidates-box');
      box.innerHTML = '';

      data.candidates.forEach(idol => {
        const card = document.createElement('div');
        card.className = 'idol-card';
        card.onclick = () => selectIdol(idol.id);
        card.innerHTML = `
          <img src="${idol.image_url}" alt="${idol.name}">
          <p><strong>${idol.name}</strong></p>
          <p style="font-size: 12px; color: #aaa;">${idol.group}</p>
        `;
        box.appendChild(card);
      });
    } catch (e) {
      console.error("候補取得エラー:", e);
    }
  }

  // 画像選択時
  function selectIdol(id) {
    selectedIdolIds.push(id);
    nextStep();
  }

  // スキップ選択時
  function skipQuestion() {
    nextStep();
  }

  // ステップ進行管理
  function nextStep() {
    if (currentQuestion < totalQuestions) {
      currentQuestion++;
      document.getElementById('progress').innerText = `第 ${currentQuestion} / ${totalQuestions} 問：好みの顔を選んでね！`;
      loadNextCandidates();
    } else {
      submitDiagnosis();
    }
  }

  // 最終結果をAPIへ送信
  async function submitDiagnosis() {
    document.getElementById('quiz-section').classList.add('hidden');
    
    try {
      const res = await fetch(`${BASE_URL}/diagnose`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ selected_idol_ids: selectedIdolIds })
      });

      const result = await res.json();
      renderResults(result);
    } catch (e) {
      console.error("診断処理エラー:", e);
      alert("診断結果の取得に失敗しました。");
    }
  }

  // 画面描画
  function renderResults(data) {
    document.getElementById('result-section').classList.remove('hidden');
    document.getElementById('result-type').innerText = data.result_type;
    document.getElementById('type-desc').innerText = data.type_description;
    document.getElementById('toxic-advice').innerText = data.toxic_advice;

    // スコア表示
    const scoreList = document.getElementById('radar-scores');
    scoreList.innerHTML = `
      <li>あざとさ: ${data.radar_scores.azato}%</li>
      <li>ハンサム: ${data.radar_scores.handsome}%</li>
      <li>儚さ: ${data.radar_scores.haganse}%</li>
      <li>ダーク: ${data.radar_scores.dark}%</li>
      <li>アイドル性: ${data.radar_scores.idol}%</li>
    `;

    // TOP 9 表示
    const top9Box = document.getElementById('top9-box');
    top9Box.innerHTML = '';
    data.top_9.forEach((idol, index) => {
      const item = document.createElement('div');
      item.className = 'top9-item';
      item.innerHTML = `
        <span class="badge">#${index + 1}</span> ${idol.match_percent}%
        <img src="${idol.image_url}" alt="${idol.name}">
        <p><strong>${idol.name}</strong></p>
      `;
      top9Box.appendChild(item);
    });
  }
</script>
</body>
</html>
