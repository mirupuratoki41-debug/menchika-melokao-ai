<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>メン地下めろ顔AI診断 | あなたの“好き”をAIが分析♡</title>
  
  <!-- OGP / Meta Tags for SNS -->
  <meta name="description" content="直感で2枚の写真から好きな顔を選ぶだけ♡ AIがあなたの潜在的なタイプを分析して「推し顔TOP9」を割り出します！">
  <meta property="og:title" content="メン地下めろ顔AI診断 | あなたの“好き”をAIが分析♡">
  <meta property="og:description" content="直感で選ぶだけ！AIがあなたのめろ顔タイプを本格分析。結果を保存してシェアしてね✨">
  <meta property="og:type" content="website">

  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <!-- Google Fonts: Zen Maru Gothic / Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
      --card-glass: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.9);
      --primary-pink: #ff6b8b;
      --accent-purple: #8a4af3;
      --text-main: #2c2c3e;
      --text-sub: #7a7a9a;
      --shadow-soft: 0 12px 32px rgba(255, 107, 139, 0.15);
      --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.06);
      --radius-main: 24px;
      --radius-card: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px 10px;
      overflow-x: hidden;
    }

    /* 背景の浮遊グラデーション光風エフェクト */
    body::before {
      content: '';
      position: fixed;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background: radial-gradient(circle at 20% 20%, rgba(255, 182, 193, 0.3) 0%, transparent 40%),
                  radial-gradient(circle at 80% 80%, rgba(216, 191, 216, 0.3) 0%, transparent 40%);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .hidden {
      display: none !important;
    }

    /* --- 1. スタート画面 --- */
    .start-card {
      background: var(--card-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid var(--card-border);
      border-radius: var(--radius-main);
      padding: 36px 24px;
      text-align: center;
      box-shadow: var(--shadow-soft);
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .badge-sub {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary-pink), var(--accent-purple));
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(255, 107, 139, 0.3);
    }

    .start-card h1 {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ff477e, #7b2cbf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      line-height: 1.25;
    }

    .tagline {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-purple);
      margin-bottom: 20px;
    }

    .description-box {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 28px;
      font-size: 13px;
      color: var(--text-main);
      line-height: 1.6;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* --- 2. 対戦画面 --- */
    .battle-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .progress-wrapper {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 20px;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-card);
    }

    .progress-bar-bg {
      flex: 1;
      height: 8px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 10px;
      overflow: hidden;
      margin-left: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, var(--primary-pink), var(--accent-purple));
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: var(--accent-purple);
      padding-right: 8px;
    }

    .battle-instruction {
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-main);
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
    }

    .battle-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card {
      position: relative;
      background: var(--card-glass);
      backdrop-filter: blur(8px);
      border-radius: var(--radius-main);
      overflow: hidden;
      border: 2px solid var(--card-border);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .card:active {
      transform: scale(0.95);
    }

    .img-container {
      width: 100%;
      padding-top: 133%; /* 3:4に近い美しい縦横比 */
      background-color: #f3f3f8;
      position: relative;
      overflow: hidden;
    }

    .img-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.25s ease;
    }

    .btn-select {
      width: 100%;
      padding: 12px 0;
      background: #ffffff;
      color: var(--primary-pink);
      border: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      border-top: 1px solid rgba(255, 107, 139, 0.15);
      transition: background 0.2s;
    }

    .card:hover .btn-select {
      background: var(--primary-pink);
      color: #ffffff;
    }

    /* タップ時のハートバースト */
    .heart {
      position: absolute;
      font-size: 32px;
      pointer-events: none;
      animation: heartFloat 0.75s ease-out forwards;
      z-index: 10;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    }

    @keyframes heartFloat {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
      }
      50% {
        transform: translate(-50%, -90%) scale(1.3) rotate(-10deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -140%) scale(1) rotate(10deg);
      }
    }

    /* --- 3. 結果画面 (SNSキャプチャカード) --- */
    .capture-area {
      background: linear-gradient(180deg, #ffffff 0%, #fff5f8 100%);
      padding: 24px 18px 20px 18px;
      border-radius: var(--radius-main);
      box-shadow: 0 16px 40px rgba(255, 107, 139, 0.2);
      border: 2px solid #ffffff;
      position: relative;
    }

    .result-header-badge {
      text-align: center;
      margin-bottom: 4px;
    }

    .result-header-badge span {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-purple);
      background: rgba(138, 74, 243, 0.08);
      padding: 3px 10px;
      border-radius: 12px;
    }

    .result-title {
      text-align: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ff477e, #7b2cbf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }

    /* TOP1（大月とき特別フィーチャー枠） */
    .top1-hero-card {
      background: linear-gradient(135deg, #fff0f5 0%, #f3e8ff 100%);
      border: 2px solid var(--primary-pink);
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 6px 16px rgba(255, 107, 139, 0.15);
      position: relative;
      overflow: hidden;
    }

    .top1-hero-card::after {
      content: 'SPECIAL MATCH';
      position: absolute;
      top: 10px;
      right: -24px;
      background: var(--primary-pink);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 8px;
      font-weight: 800;
      padding: 2px 26px;
      transform: rotate(30deg);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .top1-img-wrapper {
      width: 86px;
      height: 108px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .top1-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .top1-info {
      flex: 1;
    }

    .top1-rank-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--primary-pink);
      background: #ffffff;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 4px;
    }

    .top1-name {
      font-size: 16px;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1.2;
    }

    .top1-group {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .top1-score-badge {
      display: inline-block;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(90deg, #ff477e, #8a4af3);
      padding: 3px 10px;
      border-radius: 12px;
    }

    /* TOP2〜9 グリッド (4列×2行 または 3列) */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .grid-card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #f0e6f5;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .grid-card .img-wrapper {
      width: 100%;
      padding-top: 125%;
      position: relative;
      background: #f5f5f8;
    }

    .grid-card .img-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-meta {
      padding: 5px 4px;
      text-align: center;
    }

    .rank-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
      padding: 0 2px;
    }

    .rank-number {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 9px;
      font-weight: 800;
      color: var(--accent-purple);
    }

    .score-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 8px;
      font-weight: 800;
      color: var(--primary-pink);
    }

    .grid-name {
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .grid-group {
      font-size: 8px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .capture-footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed #f0d8e8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .capture-footer-brand {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-sub);
    }

    .capture-footer-tag {
      font-size: 9px;
      font-weight: 700;
      color: var(--primary-pink);
      background: rgba(255, 107, 139, 0.1);
      padding: 2px 8px;
      border-radius: 8px;
    }

    /* 共通ボタンコンポーネント */
    .btn-main {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary-pink), var(--accent-purple));
      color: #ffffff;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 107, 139, 0.35);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-main:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    /* X (Twitter) シェア専用ボタン */
    .btn-x {
      background: #000000;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-card);
    }

    .action-group {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 友達への拡散プロンプトメッセージ */
    .share-prompt {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      margin-top: 6px;
    }

    /* フェードインアニメーション */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade {
      animation: fadeIn 0.4s ease forwards;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 1. スタート画面 -->
    <div id="start-section" class="start-card">
      <div class="badge-sub">AI 推し顔分析ツール</div>
      <h1>メン地下めろ顔<br>AI診断</h1>
      <p class="tagline">あなたの“好き”をAIが解読♡</p>
      
      <div class="description-box">
        表示される2枚の写真から直感でタイプを選んでね！<br>
        全10回の選択で、AIがあなたの潜在的な好み顔を分析して<strong>「推し顔 TOP9」</strong>を割り出します✨
      </div>

      <button class="btn-main" onclick="startApp()">
        <span>診断をはじめる 💖</span>
      </button>
    </div>

    <!-- 2. 対戦画面 -->
    <div id="battle-section" class="hidden">
      <div class="battle-header">
        <div class="progress-wrapper">
          <div class="progress-bar-bg">
            <div id="progress-bar" class="progress-bar-fill"></div>
          </div>
          <span id="progress" class="progress-text">01 / 10</span>
        </div>
      </div>

      <p class="battle-instruction">どっちの顔がタイプ？ 直感で選んでね♡</p>

      <div class="battle-container">
        <!-- 左側 -->
        <div class="card" onclick="selectImage('left', event)">
          <div class="img-container">
            <img id="img1" src="" alt="Option 1">
          </div>
          <button class="btn-select" type="button">SELECT</button>
        </div>

        <!-- 右側 -->
        <div class="card" onclick="selectImage('right', event)">
          <div class="img-container">
            <img id="img2" src="" alt="Option 2">
          </div>
          <button class="btn-select" type="button">SELECT</button>
        </div>
      </div>
    </div>

    <!-- 3. 結果画面 -->
    <div id="result-section" class="hidden animate-fade">
      
      <!-- キャプチャ対象エリア (スクショ映えカード) -->
      <div id="capture-area" class="capture-area">
        <div class="result-header-badge">
          <span>AI DIAGNOSIS RESULT</span>
        </div>
        <h2 class="result-title">MY TOP 9 MATCHES</h2>

        <!-- #01: 大月 とき 固定フィーチャー枠 -->
        <div class="top1-hero-card">
          <div class="top1-img-wrapper">
            <img id="top1-img" src="" alt="大月 とき">
          </div>
          <div class="top1-info">
            <div class="top1-rank-tag">👑 #01 SPECIAL</div>
            <div class="top1-name">大月 とき</div>
            <div class="top1-group">SKYXROS</div>
            <div class="top1-score-badge">100% MATCH</div>
          </div>
        </div>

        <!-- #02〜#09: AIランキング 8名（グリッド表示） -->
        <div id="grid" class="grid-container">
          <!-- JSで動的挿入 -->
        </div>

        <div class="capture-footer">
          <span class="capture-footer-brand">メン地下めろ顔AI診断</span>
          <span class="capture-footer-tag">#メン地下めろ顔AI診断</span>
        </div>
      </div>

      <!-- アクションボタン群 -->
      <div class="action-group">
        <button class="btn-main" onclick="downloadResultImage()">
          <span>📸 結果画像を保存する</span>
        </button>
        <button class="btn-main btn-x" onclick="shareToX()">
          <span>𝕏 で結果をシェアする</span>
        </button>
        <button class="btn-main btn-secondary" onclick="resetApp()">
          <span>🔄 もう一度診断する</span>
        </button>
        <p class="share-prompt">友達にも結果を共有してタイプを比べよう♡</p>
      </div>

    </div>

  </div>

  <script>
    // 配信元・ドメイン自動判別
    const API = location.origin.startsWith("http") ? location.origin : "http://127.0.0.1:8000";

    let round = 1, userVector = null, currentPair = null, historyIds = [];
    // Xシェア用に数値上1位のメンバー情報を保持する変数（既存仕様を完全保持）
    let topMatchMember = null;

    // 画像URLフォーマット関数（NFC正規化 & 日本語パス対応を維持）
    function formatImageUrl(url) {
      if (!url) return "";
      if (url.startsWith("http://") || url.startsWith("https://")) return url;
      
      const cleanPath = url.replace(/\\/g, '/').replace(/^\//, '').normalize("NFC");
      const parts = cleanPath.split('/').map(p => encodeURIComponent(p));
      return `${API}/${parts.join('/')}`;
    }

    // パスからグループ名とメンバー名を解析する関数（既存仕様を維持）
    function parseGroupAndName(item) {
      const path = item.image_url || item.id || "";
      const parts = path.split(/[\/\\]/).filter(p => p.length > 0);
      
      let groupName = "";
      let memberName = "";

      if (parts.length >= 2) {
        memberName = parts[parts.length - 1].replace(/\.[^/.]+$/, "");
        const potentialGroup = parts[parts.length - 2];
        if (potentialGroup !== "images") {
          groupName = potentialGroup;
        }
      } else {
        memberName = parts[0] ? parts[0].replace(/\.[^/.]+$/, "") : "";
      }

      if (!groupName) {
        const match = memberName.match(/(.+)\((.+)\)/);
        if (match) {
          memberName = match[1].trim();
          groupName = match[2].trim();
        }
      }

      return { groupName, memberName };
    }

    function startApp() {
      document.getElementById("start-section").classList.add("hidden");
      document.getElementById("battle-section").classList.remove("hidden");
      loadNext();
    }

    async function loadNext() {
      try {
        const res = await fetch(`${API}/api/next-pair`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_vector: userVector, history_ids: historyIds })
        });

        if (!res.ok) throw new Error("APIレスポンスエラー");

        currentPair = await res.json();
        
        // 画像読み込み
        const img1 = document.getElementById("img1");
        const img2 = document.getElementById("img2");

        img1.style.opacity = "0";
        img2.style.opacity = "0";

        img1.src = formatImageUrl(currentPair.item1.image_url);
        img2.src = formatImageUrl(currentPair.item2.image_url);

        img1.onload = () => img1.style.opacity = "1";
        img2.onload = () => img2.style.opacity = "1";

      } catch (err) {
        console.error("画像読み込み失敗:", err);
      }
    }

    async function selectImage(side, event) {
      if (event) event.stopPropagation();
      if (!currentPair) return;

      createHeart(event);

      const selected = side === 'left' ? currentPair.item1 : currentPair.item2;
      historyIds.push(currentPair.item1.id, currentPair.item2.id);

      try {
        const res = await fetch(`${API}/api/update-vector`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_vector: userVector, selected_id: selected.id })
        });

        if (!res.ok) throw new Error("ベクトル更新エラー");

        const data = await res.json();
        userVector = data.user_vector;

        if (round < 10) {
          round++;
          // 進捗バーとテキストの更新
          document.getElementById("progress").textContent = `${String(round).padStart(2, '0')} / 10`;
          document.getElementById("progress-bar").style.width = `${(round / 10) * 100}%`;
          await loadNext();
        } else {
          showResult();
        }
      } catch (err) {
        console.error("更新エラー:", err);
      }
    }

    function createHeart(e) {
      if (!e) return;
      const card = e.currentTarget;
      const rect = card.getBoundingClientRect();
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = (e.clientX - rect.left) + "px";
      heart.style.top = (e.clientY - rect.top) + "px";
      card.appendChild(heart);
      setTimeout(() => heart.remove(), 750);
    }

    async function showResult() {
      document.getElementById("battle-section").classList.add("hidden");
      document.getElementById("result-section").classList.remove("hidden");

      try {
        const res = await fetch(`${API}/api/top9`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_vector: userVector })
        });
        const data = await res.json();
        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        // 数値上トップ（実質AI1位）の情報を保存（Xシェア用：既存仕様保持）
        if (data.top9 && data.top9.length > 0) {
          topMatchMember = data.top9[0];
        }

        // 1. #01固定表示：作成者（大月 とき）の画像設定
        const creatorPath = "images/SKYXROS/大月 とき.jpg";
        document.getElementById("top1-img").src = formatImageUrl(creatorPath);

        // 2. AI選出の上位8名（#02〜#09）をカードグリッドに描写
        const top8 = data.top9.slice(0, 8);
        let htmlContent = "";

        top8.forEach((item, i) => {
          const rankNum = String(i + 2).padStart(2, '0');
          const { groupName, memberName } = parseGroupAndName(item);

          htmlContent += `
            <div class="grid-card">
              <div class="img-wrapper">
                <img src="${formatImageUrl(item.image_url)}" alt="${memberName}">
              </div>
              <div class="card-meta">
                <div class="rank-row">
                  <span class="rank-number">#${rankNum}</span>
                  <span class="score-text">${item.score}%</span>
                </div>
                <div class="grid-name">${memberName}</div>
                ${groupName ? `<div class="grid-group">${groupName}</div>` : ''}
              </div>
            </div>
          `;
        });

        grid.innerHTML = htmlContent;

      } catch (err) {
        console.error("TOP9取得エラー:", err);
      }
    }

    function downloadResultImage() {
      const captureArea = document.getElementById("capture-area");
      
      html2canvas(captureArea, {
        useCORS: true,
        scale: 2, // 高解像度保存
        backgroundColor: "#ffffff",
        borderRadius: 24
      }).then(canvas => {
        const link = document.createElement("a");
        link.download = "my_top9_result.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    // X(Twitter)シェア機能（AI1位情報を含めたシェアロジックを完全維持）
    function shareToX() {
      const appUrl = window.location.origin.startsWith("http") ? window.location.href : "https://your-app-url.com";
      
      let topName = "推し";
      let topScore = 99;

      if (topMatchMember) {
        const parsed = parseGroupAndName(topMatchMember);
        topName = parsed.memberName || "推し";
        topScore = topMatchMember.score || 99;
      }

      const text = `【メン地下めろ顔AI診断】私の推し顔TOP9診断結果♡\nAIが分析した私のめろ顔タイプ1位は ${topScore}% MATCH で「${topName}」でした✨\n\nあなたは何タイプ？診断してみてね👇\n#メン地下めろ顔AI診断 #メン地下 #推し顔診断\n`;
      const xUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(appUrl)}`;
      window.open(xUrl, '_blank');
    }

    // もう一度診断する（アプリリセット）
    function resetApp() {
      round = 1;
      userVector = null;
      currentPair = null;
      historyIds = [];
      topMatchMember = null;

      document.getElementById("progress").textContent = "01 / 10";
      document.getElementById("progress-bar").style.width = "10%";
      document.getElementById("result-section").classList.add("hidden");
      document.getElementById("start-section").classList.remove("hidden");
    }
  </script>
</body>
</html>
