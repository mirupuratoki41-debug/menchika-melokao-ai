<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メンズ地下アイドル 顔タイプ診断</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f7fa;
      color: #333;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #1a1a1a; }
    p.subtitle { font-size: 0.9rem; color: #666; margin-bottom: 20px; }
    .progress {
      font-size: 0.85rem;
      font-weight: bold;
      color: #888;
      margin-bottom: 16px;
    }
    .card-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .card {
      flex: 1;
      border: 2px solid #eee;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      background: #fafafa;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #ff4757;
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .card-name {
      padding: 10px 4px;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .skip-btn {
      width: 100%;
      padding: 12px;
      background-color: #f1f2f6;
      color: #57606f;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .skip-btn:hover { background-color: #e4e7eb; }
    
    /* 診断結果用 */
    .result-section { display: none; text-align: left; }
    .result-type {
      background: #fff0f3;
      border: 1px solid #ffccd5;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .result-type h2 { color: #ff4757; font-size: 1.2rem; margin-bottom: 6px; }
    .top9-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .top9-item {
      text-align: center;
      background: #f8f9fa;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #eee;
      position: relative;
    }
    .top9-item img {
      width: 100%;
      height: 110px;
      object-fit: cover;
    }
    .rank-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .rank-badge.rank-1 { background: #ff4757; font-weight: bold; }
    .top9-name { font-size: 0.75rem; padding: 4px; font-weight: bold; }
    .loading { font-size: 1rem; color: #666; padding: 40px 0; }
  </style>
</head>
<body>

<div class="container">
  <h1>メン地下 顔タイプ診断</h1>
  <p class="subtitle">直感で好みの顔を選んでください（全10問）</p>

  <div id="quiz-section">
    <div class="progress" id="progress-text">第 1 / 10 門</div>
    <div id="loading" class="loading">画像を読み込み中...</div>
    <div class="card-container" id="card-container" style="display: none;">
      <div class="card" onclick="selectCandidate(0)">
        <img id="img-0" src="" alt="候補1">
        <div class="card-name" id="name-0">-</div>
      </div>
      <div class="card" onclick="selectCandidate(1)">
        <img id="img-1" src="" alt="候補2">
        <div class="card-name" id="name-1">-</div>
      </div>
    </div>
    <button class="skip-btn" id="skip-btn" onclick="selectCandidate(null)" style="display: none;">好みのタイプがいない（スキップ）</button>
  </div>

  <div id="result-section" class="result-section">
    <div class="result-type">
      <div style="font-size: 0.8rem; color: #888;">あなたの好みのタイプ</div>
      <h2 id="result-title">-</h2>
      <p id="result-desc" style="font-size: 0.85rem; color: #444; line-height: 1.4;"></p>
    </div>

    <h3>MY TOP 9</h3>
    <div class="top9-grid" id="top9-grid"></div>
  </div>
</div>

<script>
  // Renderで公開したバックエンドURL
  const BASE_URL = 'https://menchika-melokao-ai.onrender.com';

  let currentStep = 1;
  const maxSteps = 10;
  let historyData = [];
  let currentCandidates = [];

  // 初期読み込み
  async function fetchNextCandidates() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('card-container').style.display = 'none';
    document.getElementById('skip-btn').style.display = 'none';

    try {
      const res = await fetch(`${BASE_URL}/api/next-candidates`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history: historyData })
      });
      const data = await res.json();
      currentCandidates = data.candidates;

      document.getElementById('img-0').src = currentCandidates[0].image_url;
      document.getElementById('name-0').innerText = currentCandidates[0].name || '';
      document.getElementById('img-1').src = currentCandidates[1].image_url;
      document.getElementById('name-1').innerText = currentCandidates[1].name || '';

      document.getElementById('loading').style.display = 'none';
      document.getElementById('card-container').style.display = 'flex';
      document.getElementById('skip-btn').style.display = 'block';
    } catch (err) {
      alert('通信エラーが発生しました。時間を置いて再度お試しください。');
      console.error(err);
    }
  }

  // 選択またはスキップ処理
  async function selectCandidate(selectedIndex) {
    if (selectedIndex !== null) {
      const chosen = currentCandidates[selectedIndex];
      const rejected = currentCandidates[1 - selectedIndex];
      historyData.push({
        chosen_id: chosen.id,
        rejected_id: rejected.id
      });
    }

    if (currentStep < maxSteps) {
      currentStep++;
      document.getElementById('progress-text').innerText = `第 ${currentStep} / ${maxSteps} 問`;
      fetchNextCandidates();
    } else {
      showResult();
    }
  }

  // 最終結果の取得・描画
  async function showResult() {
    document.getElementById('quiz-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    try {
      const res = await fetch(`${BASE_URL}/diagnose`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history: historyData })
      });
      const data = await res.json();

      document.getElementById('result-title').innerText = data.user_type || 'タイプ判定完了';
      document.getElementById('result-desc').innerText = data.description || '';

      const top9Grid = document.getElementById('top9-grid');
      top9Grid.innerHTML = '';

      if (data.top_9 && data.top_9.length > 0) {
        data.top_9.forEach((item, idx) => {
          const card = document.createElement('div');
          card.className = 'top9-item';
          card.innerHTML = `
            <div class="rank-badge ${idx === 0 ? 'rank-1' : ''}">${idx + 1}位</div>
            <img src="${item.image_url}" alt="${item.name}">
            <div class="top9-name">${item.name}</div>
          `;
          top9Grid.appendChild(card);
        });
      }
    } catch (err) {
      alert('診断結果の取得に失敗しました。');
      console.error(err);
    }
  }

  // ページ読み込み時にスタート
  fetchNextCandidates();
</script>

</body>
</html>
